name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-python:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:services/api:services/worker
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/tri_core
          pip install -e services/api -e services/worker -r pipelines/inep/requirements.txt pytest httpx

      - name: Run required test suite
        run: python -m pytest packages/tri_core/tests services/api/tests services/worker/tests pipelines/inep/tests -v
