services:
  postgres:
    image: postgres:16-alpine
    container_name: enem_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: enem_user
      POSTGRES_PASSWORD: enem_password
      POSTGRES_DB: enem_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enem_user -d enem_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: enem_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: enem_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://enem_user:enem_password@postgres:5432/enem_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: enem-intelligence-production-secret-key-2026
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: enem_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://enem_user:enem_password@postgres:5432/enem_db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: enem_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads_data:
